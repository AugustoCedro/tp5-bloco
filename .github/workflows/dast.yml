name: DAST Scan
on:
  push:
    branches: ["master","main"]
  pull_request:
    branches: ["master","main"]
  workflow_dispatch:

jobs:
  dast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout #Baixar o código do repo
        user: actions/checkout@v4

      - name: Setup Java
        user: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build JAR com dependências
        run: mvn clean package -DskipTests

      - name: Verificar JAR gerado
        run: |
          echo "Conteúdo do target "
          ls -lh target/
          echo ""
          echo "Verificando se o JAR é executável"
          jar tf target/dast-demo-1.0-SNAPSHOT.jar | head-20
      - name: Start app in background
        run: | 
          echo "Iniciando app em Java"
          nohup java -jar target/dast-demo-1.0-SNAPSHOT.jar > logs.txt 2>&1
          echo $! > app.pid #salva o PID do processo
          echo "App PID: $(cat app.pid)"
      - name: Wait for app to be ready
        run: |
          echo "Aguardado aplicação em http://localhost:7000 ..."
          for i in {1..60}; do
            if curl -sSf "http://localhost:7000/hello?user=test" >/dev/null 2>&1; then
              echo "App está pronta!"
              break
            fi
            echo "Tentativa $i/60..."
            sleep 2
          done
          
          if ! curl -sSf "http://localhost:7000/hello?user=test" >/dev/null 2>&1; then
            echo "App não iniciou a tempo. Logs:"
            cat logos.txt || true
            exit 1
          fi
          
          #Testar endpoints manualmente
          echo ""
          echo "=== Testando endpoints ==="
          echo "1. Endpoint /hello:"
          curl -i "http://localhost:7000/hello?user=admin"
          echo ""
          echo "2 Endpoint /getUser:"
          curl -i "http://localhost:7000/getUser?id=1"
          echo ""
          echo "3. Endpoint /run:"
          curl -i "http://localhost:7000/run?cmd=whoami"

      - name: Create report dir
        run: mkdir -p zap-reports

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm \
            --network host \
            -v $(pwd)/zap-reports:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://127.0.0.1:7000 \
              -r zap_report.html \
              -J zap_report.json \
              -w zap_report.md \
              -d
        continue-on-error: true

      - name: Shot app logs
        if: always()
        run: |
          echo "=== Logs da aplicacao ==="
          cat logs.txt || echo "Sem logs"

      - name: List zap-reports
        if: always()
        run: |
          echo "=== Relatórios gerados ==="
          ls -lh zap-reports/ || echo "Diretório vazio"
          if [ -d "zap-reports" ]; then
            echo ""
            echo "=== Arquivos encontrados ==="
            find zap-reports -type f -exec ls -lh {} \;
          fi
      - name: Generate summary report
        if: always()
        run: |
          cat > zap-reports/RESUMO.md << 'EOF'
          # Relatório DAST - OWASP ZAP
          
          ##Aplicação Testada
          - **URL:** http://127.0.0.1:7000
          - **Framework:** Javalin 6.7.0
          - **Data:** $(date)
          
          ## Vulnerabilidades Encontradas
          
          ### 1. Information Disclosure
          **Endpoint:** `/hello?user=admin`
          - Expõe secret hardcoded na resposta
          - Severidade: ALTA
          
          ### 2. SQL Injection
          **Endpoint:** `/getUser?id=1`
          - Concatenação direta na query SQL
          - Severidade: CRÍTICA
          
          ### 3. Command Injection
          **Endpoint:** `/run?cmd=whoami`
          - Execução de comandos sem validação
          - Severidade: CRÍTICA
          
          ## Relatórios Disponíveis
          - `zap_report.html` - Relatório visual completo
          - `zap_report.json` - Dados estruturados
          - `zap_report.md` - Resumo markdown

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ];then
            echo "Parando aplicação (PID: $(cat app.pid))"
            kill $(cat app.pid) || true
            rm app.pid
          fi

      - name: Upload ZAP report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: |
            zap-reports/
            logs.txt
          retention-days: 30
          if-no-files-found: 'warn'