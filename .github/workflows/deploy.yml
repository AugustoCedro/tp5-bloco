name: Pipeline Java com ambientes

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:

  # ==========================
  # JOB 1 — BUILD
  # ==========================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de Código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Dar permissão ao Gradlew
        run: chmod +x gradlew

      - name: Instalar Chrome (para Selenium)
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable

      - name: Compilar, testar e construir JAR
        run: ./gradlew clean test shadowJar

      - name: Upload do JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/libs/*-all.jar

  # ==========================
  # JOB 2 — DEPLOY DEV
  # ==========================
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: development

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Deploy em ambiente de desenvolvimento
        run: echo "Aplicação implantada em DEV"

  # ==========================
  # JOB 3 — DEPLOY PROD
  # ==========================
  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://meuapp-producao.com

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Aprovação manual
        run: echo "Aguardando aprovação para produção"

      - name: Deploy em ambiente de produção
        run: echo "Aplicação implantada em produção"
