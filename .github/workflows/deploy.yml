name: Pipeline Java com ambientes
on:
  push:
    branches: [ "main", "master", "test" ]
  workflow_dispatch:

jobs:
  # ============================================================
  # 1) BUILD
  # ============================================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixando Código do Repositório
        uses: actions/checkout@v4

      - name: Configurando Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache do Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Dando permissão ao Gradle
        run: chmod +x ./gradlew

      - name: Build do projeto com Gradle
        run: ./gradlew build --stacktrace

      - name: Instalando Chrome
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable

      - name: Upload do JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/libs/*.jar

  # ============================================================
  # 2) DEPLOY DEV
  # ============================================================
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    environment: development

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: app
      - name: Deploy em ambiente de desenvolvimento
        run: echo "Aplicação implantada em DEV"

  # ============================================================
  # 3) DEPLOY TEST
  # ============================================================
  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test'
    environment: staging

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: app
      - name: Deploy em ambiente de teste
        run: echo "Aplicação implantada em TEST / STAGING"

  # ============================================================
  # 4) DEPLOY PROD
  # ============================================================
  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://meuapp-producao.com

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: app
      - name: Aprovação manual
        run: echo "Aguardando aprovação para produção"
      - name: Deploy em ambiente de produção
        run: echo "Aplicação implantada em produção"
