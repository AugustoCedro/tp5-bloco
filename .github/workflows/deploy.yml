name: Pipeline Java com ambientes

on:
  push:
    branches: [ "main", "master", "test", "dev" ]
  workflow_dispatch:

jobs:
  # ============================================================
  # 1) BUILD
  # ============================================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixando Código do Repositório
        uses: actions/checkout@v4

      - name: Configurando Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Log Cache Gradle
        run: echo "::notice::[$(date '+%Y-%m-%d %H:%M:%S')] Configurando cache do Gradle"

      - name: Cache do Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Dando permissão ao Gradle
        run: |
          echo "::notice::[$(date '+%Y-%m-%d %H:%M:%S')] Dando permissão ao Gradle"
          chmod +x ./gradlew

      - name: Build do projeto com Gradle
        run: |
          echo "::notice::[$(date '+%Y-%m-%d %H:%M:%S')] Iniciando build do projeto"
          ./gradlew build --stacktrace > build.log 2>&1 || echo "::error::Build falhou. Verifique build.log"

      - name: Upload logs do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log

      - name: Instalando Chrome
        run: |
          echo "::notice::[$(date '+%Y-%m-%d %H:%M:%S')] Instalando Google Chrome"
          sudo apt update
          sudo apt install -y google-chrome-stable

      - name: Upload do JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/libs/*.jar

  # ============================================================
  # 2) DEPLOY DEV
  # ============================================================
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    environment: development

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Deploy em ambiente de desenvolvimento
        run: |
          echo "::notice::[$(date '+%Y-%m-%d %H:%M:%S')] Iniciando deploy em DEV"
          echo "Aplicação implantada em DEV"

  # ============================================================
  # 3) DEPLOY TEST
  # ============================================================
  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test'
    environment: staging

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Deploy em ambiente de teste
        run: |
          echo "::notice::[$(date '+%Y-%m-%d %H:%M:%S')] Iniciando deploy em TEST / STAGING"
          echo "Aplicação implantada em TEST / STAGING"

  # ============================================================
  # 4) DEPLOY PROD
  # ============================================================
  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://meuapp-producao.com

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Aprovação manual
        run: |
          echo "::notice::[$(date '+%Y-%m-%d %H:%M:%S')] Aguardando aprovação para produção"
          echo "Aprovado manualmente"

      - name: Deploy em ambiente de produção
        run: |
          echo "::notice::[$(date '+%Y-%m-%d %H:%M:%S')] Iniciando deploy em PRODUÇÃO"
          echo "Aplicação implantada em produção"
