name: gradleci

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  release:
    types: [created]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  ARTIFACT_NAME: myapp.jar
  BUILD_DIR: build/libs

jobs:

  # ============================================================
  # 1. BUILD + TEST + COVERAGE
  # ============================================================
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assemble --no-daemon

      - name: Run Tests with Coverage
        run: ./gradlew test jacocoTestReport --no-daemon || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html
          if-no-files-found: ignore

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ env.BUILD_DIR }}/*.jar


  # ============================================================
  # 2. SAST — Security Static Analysis (CodeQL)
  # ============================================================
  codeql:
    needs: build-test-analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  # ============================================================
  # 3. DEPLOY (com aprovação manual)
  # ============================================================
  deploy:
    needs: [build-test-analyze, codeql]
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://meuapp.com  # opcional

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: ./app

      - name: Deploy Application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_KEY:  ${{ secrets.SERVER_KEY }}
        run: |
          echo "Realizando deploy..."
          # Exemplo: copiar jar para servidor
          # scp -i $SERVER_KEY ./app/${{ env.ARTIFACT_NAME }} $SERVER_USER@$SERVER_HOST:/apps/


  # ============================================================
  # 4. TESTES PÓS-DEPLOY COM SELENIUM
  # ============================================================
  selenium-tests:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run Selenium Tests
        env:
          BASE_URL: ${{ vars.APP_URL }}
        run: |
          echo "Rodando testes E2E com Selenium..."
          ./gradlew seleniumTest || true

      - name: Upload Selenium Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: build/reports/selenium
          if-no-files-found: ignore


  # ============================================================
  # 5. DAST — Security Dynamic Analysis (OWASP ZAP)
  # ============================================================
  dast:
    needs: selenium-tests
    runs-on: ubuntu-latest
    steps:
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: ${{ vars.APP_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
