name: Security Pipeline (SAST + DAST)

on:
  push:
    branches: ["main", "master", "test"]
  pull_request:
    branches: ["main", "master", "test"]
  workflow_dispatch:

jobs:
  # ============================================================
  # 1) SAST - CodeQL
  # ============================================================
  sast:
    name: CodeQL Security
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['java']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurando Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build project for CodeQL
        run: ./gradlew build -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

    # ============================================================
  # 2) DAST - OWASP ZAP
  # ============================================================
  dast:
    name: DAST Security Scan
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set gradlew permission
        run: chmod +x gradlew

      - name: Build FAT JAR (ShadowJar)
        run: ./gradlew clean shadowJar --no-daemon

      - name: Verificar JAR gerado
        run: |
          echo "Conteúdo do build/libs:"
          ls -lh build/libs/
          echo ""
          echo "Verificando conteúdo do JAR"
          jar tf $(ls build/libs/*-all.jar | head -n 1) | head -20

      - name: Start app in background
        run: |
          JAR=$(ls build/libs/*-all.jar | head -n 1)
          echo "Iniciando app em Java: $JAR"
          nohup java -jar "$JAR" > logs.txt 2>&1 &
          echo $! > app.pid
          echo "App PID: $(cat app.pid)"

      - name: Wait for app to be ready
        run: |
          echo "Esperando aplicação iniciar na porta 7000..."
          for i in {1..60}; do
            if curl -sf 'http://localhost:7000/hello?user=bob@user.com' >/dev/null 2>&1; then
              echo "Aplicação está pronta!"
              break
            fi
            echo "Tentativa $i/60..."
            sleep 2
          done
          
          if ! curl -sf 'http://localhost:7000/hello?user=bob@user.com' >/dev/null 2>&1; then
            echo "A aplicação não subiu. Logs:"
            cat logs.txt || true
            exit 1
          fi

      - name: Create report dir
        run: mkdir -p zap-reports

