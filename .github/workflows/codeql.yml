name: Security Pipeline (SAST + DAST)

on:
  push:
    branches: ["main", "master", "test"]
  pull_request:
    branches: ["main", "master", "test"]
  workflow_dispatch:

jobs:
  # ============================================================
  # 1) SAST - CodeQL
  # ============================================================
  sast:
    name: CodeQL Security
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['java']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurando Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build project for CodeQL
        run: ./gradlew build -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ============================================================
  # 2) DAST - OWASP ZAP
  # ============================================================
  dast:
    name: DAST Security Scan
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run app
        run: |
          ./gradlew bootRun &
          sleep 20 # espera app subir

      - name: Install OWASP ZAP
        run: |
          sudo apt update
          sudo apt install -y zaproxy zap-cli

      - name: Run DAST scan
        run: |
          zap.sh -daemon -port 8090 -host 127.0.0.1 -newsession session1
          zap-cli -p 8090 status -t 120
          zap-cli -p 8090 spider http://localhost:8080
          zap-cli -p 8090 active-scan http://localhost:8080
          zap-cli -p 8090 report -o zap_report.html -f html

      - name: Upload DAST report
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: zap_report.html
