plugins {
    id 'java'
    id 'application'
    id 'jacoco' // necessário para gerar reports
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

mainClassName = 'org.example.app.App'

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'net.jqwik:jqwik:1.9.3'

    implementation 'io.javalin:javalin:6.7.0'
    runtimeOnly 'io.javalin:javalin-rendering:6.7.0'

    implementation 'org.thymeleaf:thymeleaf:3.1.3.RELEASE'

    implementation 'org.slf4j:slf4j-simple:2.0.16'

    implementation 'org.seleniumhq.selenium:selenium-java:4.37.0'

    implementation 'io.github.bonigarcia:webdrivermanager:6.3.2'
}

jacoco {
    toolVersion = "0.8.10"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
}

test {
    useJUnitPlatform()
    finalizedBy(tasks.named("jacocoTestReport"))
}

shadowJar {
    manifest {
        attributes 'Main-Class': mainClassName
    }
}
